[workspace]
members = [
    "crates/mote-core",
    "crates/mote-win",
    "crates/mote-render",
    "crates/mote-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Mote Contributors"]
repository = "https://github.com/joshuasknott/mote"

[workspace.dependencies]
mote-core = { path = "crates/mote-core" }
mote-win = { path = "crates/mote-win" }
mote-render = { path = "crates/mote-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
